server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/library_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
app.cors-origin=${CORS_ORIGIN:http://localhost:5173}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

library.loan-days=14
library.fine-per-day=5
